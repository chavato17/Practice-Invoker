
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Invoker</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <hero>
        <div class="hero-left">
            <h2>Keybinds</h2>
            <div class="keybindskills"><div><img src="orbs/quas.jpg" alt=""><p>Quas</p></div><button class = "key quasbtn">Q</button></div>
            <div class="keybindskills"><div><img src="orbs/wex.jpg" alt=""><p>Wex</p></div><button class = "key wexbtn">W</button></div>
            <div class="keybindskills"><div><img src="orbs/exort.jpg" alt=""><p>Exort</p></div><button class = "key exortbtn">E</button></div>
            <div class="keybindskills"><div><img src="orbs/invoke.webp" alt=""><p>Invoke</p></div><button class = "key invokebtn">R</button></div>
            <button id="reset-keybinds">Reset Keybinds</button>
        </div>
        <div class="hero-center">
            <span id="clock-display" class="clock-hide"></span>
            <div>
                <img id="Orb1" src="spells/no-spell.webp" alt="">
                <img id="Orb2" src="spells/no-spell.webp" alt="">
                <img id="Orb3" src="spells/no-spell.webp" alt="">
            </div>
            <div id="invoker-spells">
                <img id="spell1" src="spells/no-spell.webp" alt="">
                <img id="spell2" src="spells/no-spell.webp" alt="">
            </div>
            <button id="start-practice">Start Practice</button>
            <button id="restart-btn" class="restart-hide">Restart</button>
        </div>
        <div class="hero-right">

        </div>
    </hero>
</body>
</html>
